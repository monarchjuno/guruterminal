[package]
name = "guruterminal-desktop"
version = "0.0.1-rc.1"
edition = "2021"
rust-version = "1.85"
description = "Local native app for research with durable Guru Terminal memory"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "guruterminal_desktop"
path = "src/lib.rs"

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
e2e = ["webdriver"]

[[bin]]
name = "guruterminal"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.11"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
cfb = "0.14"
dom_smoothie = "0.18"
encoding_rs = "0.8"
futures-util = "0.3"
fs2 = "0.4"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
guruterminal-core = { path = "../../.." }
hex = "0.4"
httpdate = "1.0.3"
htmd = "0.5"
office_oxide = { version = "0.1.8", default-features = false }
open = "5.4"
pdf_oxide = { version = "0.3.77", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls-native-roots", "stream"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rfd = "0.15"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test", "unstable"] }

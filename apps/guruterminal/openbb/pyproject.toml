[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "guruterminal-openbb"
version = "1.0.0"
description = "Read-only OpenBB MCP sidecar for Guru Terminal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Guru Terminal contributors" }]
dependencies = [
  "openbb[all]==4.7.2",
  "openbb-mcp-server==1.4.1",
]

[project.scripts]
guruterminal-openbb = "guruterminal_openbb.server:main"

[dependency-groups]
dev = [
  "pyinstaller==6.21.0",
  "pytest>=8.3,<10",
  "ruff==0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guruterminal_openbb"]

[tool.hatch.build.targets.wheel.force-include]
"runtime-manifest.json" = "guruterminal_openbb/runtime-manifest.json"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "live: opt-in network validation against a staged OpenBB bundle",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.uv]
package = true

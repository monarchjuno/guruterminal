name: Guru Terminal CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guruterminal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      packaging: ${{ steps.scope.outputs.packaging }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify native and packaging surfaces
        id: scope
        env:
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 apps/guruterminal/scripts/ci_change_scope.py

  verify-web:
    name: Web contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node 22.19
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          node-cache: |
            apps/guruterminal/package-lock.json
            apps/guruterminal/e2e/package-lock.json
            apps/guruterminal/compute/package-lock.json

      - name: Verify renderer, compute, and E2E tooling
        working-directory: apps/guruterminal
        run: |
          set -euo pipefail
          npm ci
          (cd e2e && npm ci)
          (cd compute && npm ci --ignore-scripts)
          sh scripts/check.sh web

  verify-python:
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python 3.12 and uv
        uses: ./.github/actions/setup-toolchains
        with:
          python: "true"

      - name: Verify finance and OpenBB sidecars
        run: |
          set -euo pipefail
          uv sync --project apps/guruterminal/python --locked --python 3.12
          uv sync --project apps/guruterminal/openbb --locked --python 3.12
          sh apps/guruterminal/scripts/check.sh python

  verify-rust:
    name: Rust contracts
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup-toolchains
        with:
          rust: "true"
          rust-components: clippy,rustfmt
          rust-cache-key: verify

      - name: Verify workspace and desktop Rust
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --locked
          sh apps/guruterminal/scripts/check.sh rust

  verify:
    name: Source and product contracts
    needs:
      - verify-web
      - verify-python
      - verify-rust
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source check
        run: |
          set -euo pipefail
          test "${{ needs.verify-web.result }}" = success
          test "${{ needs.verify-python.result }}" = success
          test "${{ needs.verify-rust.result }}" = success

  native-e2e:
    name: Native macOS interaction
    needs: changes
    runs-on: ${{ needs.changes.outputs.native == 'true' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - name: Skip unchanged native surface
        if: ${{ needs.changes.outputs.native != 'true' }}
        run: echo "No native-surface changes; skipping the macOS interaction suite."

      - name: Check out repository
        if: ${{ needs.changes.outputs.native == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install CI toolchains
        if: ${{ needs.changes.outputs.native == 'true' }}
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          node-cache: |
            apps/guruterminal/package-lock.json
            apps/guruterminal/e2e/package-lock.json
          rust: "true"
          rust-cache-key: e2e
          python: "true"

      - name: Install renderer dependencies
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: apps/guruterminal
        run: npm ci

      - name: Install native E2E dependencies
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: apps/guruterminal/e2e
        run: npm ci

      - name: Stage pinned macOS sidecars
        if: ${{ needs.changes.outputs.native == 'true' }}
        run: apps/guruterminal/scripts/stage-macos-arm64.sh

      - name: Run native interaction regression suite
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: apps/guruterminal/e2e
        env:
          GURUTERMINAL_E2E_REQUIRE_STAGED_RUNTIMES: "1"
          # A fresh macOS runner must compile the Tauri test binary before its
          # WebDriver endpoint can bind. Local runs retain the five-minute default.
          GURUTERMINAL_E2E_STARTUP_TIMEOUT_MS: "600000"
        run: |
          npm run test:native:full
          npm run test:persistence

  native-e2e-windows:
    name: Native Windows interaction
    needs: changes
    runs-on: ${{ needs.changes.outputs.native == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Skip unchanged native surface
        if: ${{ needs.changes.outputs.native != 'true' }}
        run: echo "No native-surface changes; skipping the Windows interaction suite."

      - name: Check out repository
        if: ${{ needs.changes.outputs.native == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install CI toolchains
        if: ${{ needs.changes.outputs.native == 'true' }}
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          node-cache: |
            apps/guruterminal/package-lock.json
            apps/guruterminal/e2e/package-lock.json
          rust: "true"
          rust-cache-key: e2e
          python: "true"

      - name: Verify Windows Job Object descendant containment
        if: ${{ needs.changes.outputs.native == 'true' }}
        shell: pwsh
        run: python apps/guruterminal/scripts/check-sidecars.py --windows-job-self-test

      - name: Install renderer dependencies
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: apps/guruterminal
        shell: pwsh
        run: npm ci

      - name: Install native E2E dependencies
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: apps/guruterminal/e2e
        shell: pwsh
        run: npm ci

      - name: Stage pinned Windows sidecars
        if: ${{ needs.changes.outputs.native == 'true' }}
        shell: pwsh
        run: apps/guruterminal/scripts/stage-windows-x64.ps1

      - name: Run native Windows interaction regression suite
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: apps/guruterminal/e2e
        shell: pwsh
        env:
          GURUTERMINAL_E2E_REQUIRE_STAGED_RUNTIMES: "1"
          # A fresh Windows runner needs a 20-minute cold-build budget before
          # its WebDriver endpoint can bind. Local runs retain the five-minute default.
          GURUTERMINAL_E2E_STARTUP_TIMEOUT_MS: "1200000"
        run: |
          npm run test:native:windows:full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:persistence:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package-smoke:
    name: Package smoke (${{ matrix.target }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ needs.changes.outputs.packaging == 'true' && matrix.os || 'ubuntu-latest' }}
    steps:
      - name: Skip unchanged packaging surface
        if: ${{ needs.changes.outputs.packaging != 'true' }}
        run: echo "No packaging-surface changes; skipping ${{ matrix.target }} package smoke."

      - name: Check out repository
        if: ${{ needs.changes.outputs.packaging == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install CI toolchains
        if: ${{ needs.changes.outputs.packaging == 'true' }}
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          rust: "true"
          rust-targets: ${{ matrix.target }}
          rust-cache-key: package-smoke
          python: "true"

      - name: Verify Windows Job Object descendant containment
        if: ${{ needs.changes.outputs.packaging == 'true' && runner.os == 'Windows' }}
        run: python apps/guruterminal/scripts/check-sidecars.py --windows-job-self-test

      - name: Install renderer dependencies
        if: ${{ needs.changes.outputs.packaging == 'true' }}
        working-directory: apps/guruterminal
        run: npm ci

      - name: Stage pinned macOS sidecars
        if: ${{ needs.changes.outputs.packaging == 'true' && runner.os == 'macOS' }}
        run: apps/guruterminal/scripts/stage-macos-arm64.sh

      - name: Stage pinned Windows sidecars
        if: ${{ needs.changes.outputs.packaging == 'true' && runner.os == 'Windows' }}
        shell: pwsh
        run: apps/guruterminal/scripts/stage-windows-x64.ps1

      - name: Build unsigned package smoke
        if: ${{ needs.changes.outputs.packaging == 'true' }}
        working-directory: apps/guruterminal
        shell: bash
        run: >-
          npm exec -- tauri build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.package-smoke.conf.json

      - name: Assert installer was produced
        if: ${{ needs.changes.outputs.packaging == 'true' }}
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$BUNDLE" in
            dmg) pattern='*.dmg' ;;
            nsis) pattern='*-setup.exe' ;;
            *) exit 1 ;;
          esac
          test -n "$(find "apps/guruterminal/src-tauri/target/$TARGET/release/bundle/$BUNDLE" -type f -name "$pattern" -print -quit)"

      - name: Verify installed Windows package contents and workers
        if: ${{ needs.changes.outputs.packaging == 'true' && matrix.bundle == 'nsis' }}
        shell: pwsh
        timeout-minutes: 20
        run: |
          $bundleRoot = "apps/guruterminal/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundleRoot -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one final NSIS installer."
          }
          $expectedVersion = (
            Get-Content -LiteralPath "apps/guruterminal/src-tauri/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version
          & apps/guruterminal/scripts/check-windows-installer.ps1 `
            -Installer $installers[0].FullName `
            -ExpectedVersion $expectedVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Final NSIS package inspection failed."
          }

      - name: Verify mounted macOS package metadata
        if: ${{ needs.changes.outputs.packaging == 'true' && matrix.bundle == 'dmg' }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/guruterminal/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          shopt -s nullglob
          DMGS=("$BUNDLE_ROOT"/*.dmg)
          test "${#DMGS[@]}" -eq 1
          hdiutil verify "${DMGS[0]}" >/dev/null
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/guruterminal-dmg.XXXXXX")"
          DMG_ATTACHED=false
          detach_dmg_mount() {
            if [[ "$DMG_ATTACHED" != true ]]; then
              return
            fi
            if ! hdiutil detach "$MOUNT_DIR" >/dev/null; then
              hdiutil detach -force "$MOUNT_DIR" >/dev/null
            fi
            DMG_ATTACHED=false
          }
          cleanup_dmg_mount() {
            detach_dmg_mount
            rmdir "$MOUNT_DIR"
          }
          trap cleanup_dmg_mount EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          hdiutil attach "${DMGS[0]}" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=true
          MOUNTED_APP="$MOUNT_DIR/Guru Terminal.app"
          test -d "$MOUNTED_APP"
          apps/guruterminal/scripts/check-macos-app-bundle.sh "$MOUNTED_APP"
          detach_dmg_mount
          rmdir "$MOUNT_DIR"
          trap - EXIT HUP INT TERM

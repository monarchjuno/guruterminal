name: Guru Terminal CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guruterminal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and product contracts
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/guruterminal/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.2
          enable-cache: true
          cache-dependency-glob: |
            apps/guruterminal/python/uv.lock
            apps/guruterminal/openbb/uv.lock

      - name: Verify Guru Terminal source and product contracts
        run: scripts/verify.sh

  native-e2e:
    name: Native macOS interaction
    needs: verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            apps/guruterminal/package-lock.json
            apps/guruterminal/e2e/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Install renderer dependencies
        working-directory: apps/guruterminal
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: apps/guruterminal/e2e
        run: npm ci

      - name: Run native interaction regression suite
        working-directory: apps/guruterminal/e2e
        run: |
          npm run test:native:full
          npm run test:persistence

  package-smoke:
    name: Package smoke (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/guruterminal/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify Windows Job Object descendant containment
        if: runner.os == 'Windows'
        run: python apps/guruterminal/scripts/check-sidecars.py --windows-job-self-test

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.2
          enable-cache: true
          cache-dependency-glob: |
            apps/guruterminal/python/uv.lock
            apps/guruterminal/openbb/uv.lock

      - name: Install renderer dependencies
        working-directory: apps/guruterminal
        run: npm ci

      - name: Stage pinned macOS sidecars
        if: runner.os == 'macOS'
        run: apps/guruterminal/scripts/stage-macos-arm64.sh

      - name: Stage pinned Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: apps/guruterminal/scripts/stage-windows-x64.ps1

      - name: Build unsigned package smoke
        working-directory: apps/guruterminal
        shell: bash
        run: >-
          npm exec -- tauri build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundle }}
          --config src-tauri/tauri.package-smoke.conf.json

      - name: Assert installer was produced
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$BUNDLE" in
            dmg) pattern='*.dmg' ;;
            nsis) pattern='*-setup.exe' ;;
            *) exit 1 ;;
          esac
          test -n "$(find "apps/guruterminal/src-tauri/target/$TARGET/release/bundle/$BUNDLE" -type f -name "$pattern" -print -quit)"

      - name: Verify installed Windows package contents and workers
        if: matrix.bundle == 'nsis'
        shell: pwsh
        timeout-minutes: 20
        run: |
          $bundleRoot = "apps/guruterminal/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundleRoot -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one final NSIS installer."
          }
          $expectedVersion = (
            Get-Content -LiteralPath "apps/guruterminal/src-tauri/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version
          & apps/guruterminal/scripts/check-windows-installer.ps1 `
            -Installer $installers[0].FullName `
            -ExpectedVersion $expectedVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Final NSIS package inspection failed."
          }

      - name: Verify mounted macOS package metadata
        if: matrix.bundle == 'dmg'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/guruterminal/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          shopt -s nullglob
          DMGS=("$BUNDLE_ROOT"/*.dmg)
          test "${#DMGS[@]}" -eq 1
          hdiutil verify "${DMGS[0]}" >/dev/null
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/guruterminal-dmg.XXXXXX")"
          DMG_ATTACHED=false
          cleanup_dmg_mount() {
            if [[ "$DMG_ATTACHED" == true ]]; then
              hdiutil detach "$MOUNT_DIR" >/dev/null
            fi
            rmdir "$MOUNT_DIR"
          }
          trap cleanup_dmg_mount EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          hdiutil attach "${DMGS[0]}" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=true
          MOUNTED_APP="$MOUNT_DIR/Guru Terminal.app"
          test -d "$MOUNTED_APP"
          apps/guruterminal/scripts/check-macos-app-bundle.sh "$MOUNTED_APP"
          hdiutil detach "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=false
          rmdir "$MOUNT_DIR"
          trap - EXIT HUP INT TERM

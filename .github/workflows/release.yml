name: Guru Terminal Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: guruterminal-release
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      macos_bundle_version: ${{ steps.macos_bundle_version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: identity
        name: Match tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./apps/guruterminal/package.json').version")"
          TAURI_VERSION="$(node -p "require('./apps/guruterminal/src-tauri/tauri.conf.json').version")"
          DESKTOP_VERSION="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' \
              apps/guruterminal/src-tauri/Cargo.toml | head -n 1
          )"
          CORE_VERSION="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1
          )"
          test "$GITHUB_REPOSITORY" = "monarchjuno/guruterminal"
          test -n "$APP_VERSION"
          test "$TAURI_VERSION" = "$APP_VERSION"
          test "$DESKTOP_VERSION" = "$APP_VERSION"
          test "$CORE_VERSION" = "$APP_VERSION"
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            PRERELEASE=true
          elif [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            PRERELEASE=false
          else
            echo "Releases must use canonical X.Y.Z or X.Y.Z-rc.N without build metadata." >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: macos_bundle_version
        name: Allocate a monotonic macOS bundle build number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          METADATA_DIRECTORY="$RUNNER_TEMP/retained-release-metadata"
          RELEASE_TAGS="$RUNNER_TEMP/retained-release-tags.txt"
          mkdir -p "$METADATA_DIRECTORY"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' > "$RELEASE_TAGS"
          release_index=0
          while IFS= read -r release_tag; do
            test -n "$release_tag"
            release_index=$((release_index + 1))
            destination="$METADATA_DIRECTORY/$release_index"
            mkdir "$destination"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern RELEASE-METADATA.json \
              --dir "$destination"
          done < "$RELEASE_TAGS"
          MACOS_BUNDLE_VERSION="$(
            python3 apps/guruterminal/scripts/next-macos-bundle-version.py \
              --run-number "$GITHUB_RUN_NUMBER" \
              --release-metadata-directory "$METADATA_DIRECTORY"
          )"
          [[ "$MACOS_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          echo "value=$MACOS_BUNDLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require exact source commit to have passed protected CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          gh api --paginate \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_COMMIT&status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .head_sha, .status, .conclusion, .head_repository.full_name, .repository.full_name, .event, .head_branch] | @tsv' \
            > "$RUNNER_TEMP/ci-runs.tsv"
          VERIFIED_RUN_ID="$(
            awk -F '\t' -v sha="$SOURCE_COMMIT" -v repository="$GITHUB_REPOSITORY" '
              $2 == ".github/workflows/ci.yml" &&
              $3 == sha &&
              $4 == "completed" &&
              $5 == "success" &&
              $6 == repository &&
              $7 == repository &&
              $8 == "push" &&
              $9 == "main" { print $1; exit }
            ' "$RUNNER_TEMP/ci-runs.tsv"
          )"
          test -n "$VERIFIED_RUN_ID" || {
            echo "release source commit has no successful exact-SHA ci.yml run" >&2
            exit 1
          }
          echo "verified exact-source CI run $VERIFIED_RUN_ID"

      - name: Require dated changelog for stable release
        if: steps.identity.outputs.prerelease == 'false'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import date
          import os
          from pathlib import Path
          import re

          version = os.environ["RELEASE_VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          unreleased_heading = f"## {version} - Unreleased"
          if unreleased_heading in lines:
              raise SystemExit(
                  f"Stable release cannot retain {unreleased_heading!r}."
              )
          heading = re.compile(
              rf"^## {re.escape(version)} - ([0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}})$"
          )
          matches = [heading.fullmatch(line) for line in lines]
          matches = [match for match in matches if match is not None]
          if len(matches) != 1:
              raise SystemExit(
                  f"Stable release requires exactly one '## {version} - YYYY-MM-DD' heading."
              )
          try:
              date.fromisoformat(matches[0].group(1))
          except ValueError as error:
              raise SystemExit(f"Stable release heading has an invalid date: {error}")
          PY

      - name: Require published release candidate before stable release
        if: steps.identity.outputs.prerelease == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED_RC_TAGS="$(
            gh api --paginate \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == true and .published_at != null) | .tag_name'
          )"
          MATCHING_RC=false
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]] \
              && [[ "${BASH_REMATCH[1]}" == "$RELEASE_VERSION" ]]; then
              MATCHING_RC=true
              break
            fi
          done <<< "$PUBLISHED_RC_TAGS"
          if [[ "$MATCHING_RC" != true ]]; then
            echo "Stable release requires an already published, non-draft v${RELEASE_VERSION}-rc.N prerelease." >&2
            exit 1
          fi

      - name: Validate release configuration
        run: |
          python3 apps/guruterminal/scripts/check-macos-bundle-version.py \
            --tauri-config apps/guruterminal/src-tauri/tauri.conf.json \
            --source-plist apps/guruterminal/src-tauri/Info.plist
          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path

          base = json.loads(Path("apps/guruterminal/src-tauri/tauri.conf.json").read_text())
          release = json.loads(Path("apps/guruterminal/src-tauri/tauri.release.conf.json").read_text())
          with Path("apps/guruterminal/src-tauri/Info.plist").open("rb") as source:
              info = plistlib.load(source)
          assert base["productName"] == "Guru Terminal"
          assert base["identifier"] == "com.monarchjuno.guruterminal"
          assert base["build"]["beforeBuildCommand"] == "npm run build"
          assert base["version"].split("-", 1)[0] == info["CFBundleShortVersionString"]
          bundle_version = base["bundle"]["macOS"]["bundleVersion"]
          bundle_components = bundle_version.split(".") if isinstance(bundle_version, str) else []
          assert 1 <= len(bundle_components) <= 3
          assert all(component.isdigit() for component in bundle_components)
          assert any(int(component) > 0 for component in bundle_components)
          assert base["bundle"]["macOS"]["minimumSystemVersion"] == "13.0"
          assert release["bundle"]["createUpdaterArtifacts"] is True
          assert release["bundle"]["externalBin"] == ["binaries/guruterminal-core"]
          assert release["bundle"]["resources"] == {
              "resources/pi-runtime/": "pi-runtime",
              "../agent/": "guruterminal-agent",
              "../../../LICENSE": "LICENSE",
              "../../../NOTICE": "NOTICE",
              "../THIRD_PARTY_NOTICES.md": "THIRD_PARTY_NOTICES.md",
          }
          PY

  build-macos:
    name: Signed macOS arm64 release
    needs: validate
    runs-on: macos-15
    environment: release
    steps:
      - name: Require release credentials
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.GURUTERMINAL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.GURUTERMINAL_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.GURUTERMINAL_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.GURUTERMINAL_APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.GURUTERMINAL_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.GURUTERMINAL_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.GURUTERMINAL_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in \
            UPDATER_PUBLIC_KEY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            test -n "${!name:-}" || {
              echo "Required release credential is absent: $name" >&2
              exit 1
            }
          done

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/guruterminal/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.2
          enable-cache: true
          cache-dependency-glob: |
            apps/guruterminal/python/uv.lock
            apps/guruterminal/openbb/uv.lock

      - name: Install renderer dependencies
        working-directory: apps/guruterminal
        run: npm ci

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.GURUTERMINAL_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.GURUTERMINAL_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/guruterminal-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/guruterminal-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" \
            | openssl base64 -d -A -out "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "GURUTERMINAL_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure embedded updater
        shell: bash
        env:
          GURUTERMINAL_UPDATER_PUBLIC_KEY: ${{ secrets.GURUTERMINAL_UPDATER_PUBLIC_KEY }}
          GURUTERMINAL_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GURUTERMINAL_MACOS_BUNDLE_VERSION: ${{ needs.validate.outputs.macos_bundle_version }}
        run: |
          set -euo pipefail
          RELEASE_CONFIG="$RUNNER_TEMP/guruterminal-tauri-release.json"
          python3 apps/guruterminal/scripts/create-release-config.py \
            --platform macos \
            --version "$GURUTERMINAL_RELEASE_VERSION" \
            --macos-bundle-version "$GURUTERMINAL_MACOS_BUNDLE_VERSION" \
            --release-config apps/guruterminal/src-tauri/tauri.release.conf.json \
            --output "$RELEASE_CONFIG"
          python3 - "$RELEASE_CONFIG" "$GURUTERMINAL_MACOS_BUNDLE_VERSION" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          assert config["bundle"]["macOS"]["bundleVersion"] == sys.argv[2]
          PY
          echo "GURUTERMINAL_TAURI_RELEASE_CONFIG=$RELEASE_CONFIG" >> "$GITHUB_ENV"

      - name: Stage and sign sidecars and OpenBB runtime
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.GURUTERMINAL_APPLE_SIGNING_IDENTITY }}
          GURUTERMINAL_REQUIRE_DISTRIBUTION_SIGNING: "1"
        run: apps/guruterminal/scripts/stage-macos-arm64.sh

      - name: Build, sign, and notarize Guru Terminal
        working-directory: apps/guruterminal
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.GURUTERMINAL_APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.GURUTERMINAL_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.GURUTERMINAL_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.GURUTERMINAL_APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${TAURI_CONFIG:-}"
          test -s "$GURUTERMINAL_TAURI_RELEASE_CONFIG"
          npm exec -- tauri build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config "$GURUTERMINAL_TAURI_RELEASE_CONFIG"

      - name: Notarize and staple the DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.GURUTERMINAL_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.GURUTERMINAL_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.GURUTERMINAL_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/guruterminal/src-tauri/target/aarch64-apple-darwin/release/bundle"
          shopt -s nullglob
          DMGS=("$BUNDLE_ROOT"/dmg/*.dmg)
          test "${#DMGS[@]}" -eq 1
          NOTARY_RESULT="$RUNNER_TEMP/guruterminal-dmg-notary.json"
          xcrun notarytool submit "${DMGS[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$NOTARY_RESULT"
          python3 - "$NOTARY_RESULT" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "Accepted":
              raise SystemExit(f"DMG notarization was not accepted: {result}")
          PY
          xcrun stapler staple "${DMGS[0]}"

      - name: Verify signatures, notarization, and updater artifacts
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.GURUTERMINAL_APPLE_TEAM_ID }}
          GURUTERMINAL_MACOS_BUNDLE_VERSION: ${{ needs.validate.outputs.macos_bundle_version }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/guruterminal/src-tauri/target/aarch64-apple-darwin/release/bundle"
          shopt -s nullglob
          APPS=("$BUNDLE_ROOT"/macos/*.app)
          DMGS=("$BUNDLE_ROOT"/dmg/*.dmg)
          UPDATERS=("$BUNDLE_ROOT"/macos/*.app.tar.gz)
          test "${#APPS[@]}" -eq 1
          test "${#DMGS[@]}" -eq 1
          test "${#UPDATERS[@]}" -eq 1
          APP_BUNDLE="${APPS[0]}"
          DMG="${DMGS[0]}"
          UPDATER="${UPDATERS[0]}"
          hdiutil verify "$DMG" >/dev/null
          python3 apps/guruterminal/scripts/check-macos-bundle-version.py \
            --tauri-config apps/guruterminal/src-tauri/tauri.conf.json \
            --source-plist apps/guruterminal/src-tauri/Info.plist \
            --expected-bundle-version "$GURUTERMINAL_MACOS_BUNDLE_VERSION" \
            --bundle-plist "$APP_BUNDLE/Contents/Info.plist"
          PI_RUNTIME="$APP_BUNDLE/Contents/Resources/pi-runtime"
          PI_BINARY="$PI_RUNTIME/guruterminal-pi"
          test -x "$PI_BINARY"
          test -s "$APP_BUNDLE/Contents/Resources/LICENSE"
          test -s "$APP_BUNDLE/Contents/Resources/NOTICE"
          test -s "$APP_BUNDLE/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -s "$UPDATER.sig"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$APP_BUNDLE"
          xcrun stapler validate "$DMG"
          find "$PI_RUNTIME" -type f -exec sh -c '
            team=$1
            shift
            for binary do
              if LC_ALL=C file "$binary" | grep -q "Mach-O"; then
                codesign --verify --strict --verbose=2 "$binary"
                codesign --display --verbose=4 "$binary" 2>&1 \
                  | grep -Fqx "TeamIdentifier=$team"
              fi
            done
          ' sh "$APPLE_TEAM_ID" {} +
          for entitlement in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory; do
            codesign --display --entitlements :- "$PI_BINARY" 2>/dev/null \
              | plutil -extract "$entitlement" raw -o - - \
              | grep -qx true
          done
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/guruterminal-dmg.XXXXXX")"
          DMG_ATTACHED=false
          cleanup_dmg_mount() {
            if [[ "$DMG_ATTACHED" == true ]]; then
              hdiutil detach "$MOUNT_DIR" >/dev/null
            fi
            rmdir "$MOUNT_DIR"
          }
          trap cleanup_dmg_mount EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          hdiutil attach "$DMG" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=true
          MOUNTED_APP="$MOUNT_DIR/Guru Terminal.app"
          test -d "$MOUNTED_APP"
          apps/guruterminal/scripts/check-macos-app-bundle.sh \
            "$MOUNTED_APP" \
            --expected-bundle-version "$GURUTERMINAL_MACOS_BUNDLE_VERSION"
          hdiutil detach "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=false
          rmdir "$MOUNT_DIR"
          trap - EXIT HUP INT TERM

      - name: Normalize macOS release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 apps/guruterminal/scripts/prepare-release-assets.py \
            --platform macos \
            --version "$RELEASE_VERSION" \
            --bundle-root apps/guruterminal/src-tauri/target/aarch64-apple-darwin/release/bundle \
            --output release-assets

      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guruterminal-${{ needs.validate.outputs.version }}-macos-aarch64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${GURUTERMINAL_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$GURUTERMINAL_SIGNING_KEYCHAIN" || true
          fi
          rm -f -- \
            "$RUNNER_TEMP/guruterminal-signing.p12" \
            "$RUNNER_TEMP/guruterminal-tauri-release.json" \
            "$RUNNER_TEMP/guruterminal-dmg-notary.json"

  build-windows:
    name: Signed Windows x64 release
    needs: validate
    runs-on: windows-latest
    environment: release
    steps:
      - name: Require release credentials
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.GURUTERMINAL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.GURUTERMINAL_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GURUTERMINAL_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $required = @(
            "UPDATER_PUBLIC_KEY",
            "TAURI_SIGNING_PRIVATE_KEY",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD",
            "WINDOWS_CERTIFICATE",
            "WINDOWS_CERTIFICATE_PASSWORD"
          )
          foreach ($name in $required) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Required release credential is absent: $name"
            }
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node 22.19
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/guruterminal/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.2
          enable-cache: true
          cache-dependency-glob: |
            apps/guruterminal/python/uv.lock
            apps/guruterminal/openbb/uv.lock

      - name: Install renderer dependencies
        working-directory: apps/guruterminal
        run: npm ci

      - name: Import Authenticode certificate and configure updater
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.GURUTERMINAL_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GURUTERMINAL_WINDOWS_CERTIFICATE_PASSWORD }}
          GURUTERMINAL_UPDATER_PUBLIC_KEY: ${{ secrets.GURUTERMINAL_UPDATER_PUBLIC_KEY }}
          GURUTERMINAL_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GURUTERMINAL_WINDOWS_TIMESTAMP_URL: https://timestamp.digicert.com
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "guruterminal-signing.pfx"
          $encoded = $env:WINDOWS_CERTIFICATE -replace '\s', ''
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))
          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $importedCertificates = @(
            Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          )
          $privateCertificates = @(
            $importedCertificates | Where-Object { $_.HasPrivateKey }
          )
          if ($privateCertificates.Count -ne 1) {
            throw "Expected exactly one imported Authenticode certificate with a private key."
          }
          $certificate = $privateCertificates[0]
          $env:GURUTERMINAL_WINDOWS_CERTIFICATE_THUMBPRINT = $certificate.Thumbprint
          $releaseConfig = Join-Path $env:RUNNER_TEMP "guruterminal-tauri-release.json"
          & python apps/guruterminal/scripts/create-release-config.py `
            --platform windows `
            --version $env:GURUTERMINAL_RELEASE_VERSION `
            --release-config apps/guruterminal/src-tauri/tauri.release.conf.json `
            --output $releaseConfig
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate the merged Tauri release config."
          }
          "GURUTERMINAL_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GURUTERMINAL_TAURI_RELEASE_CONFIG=$releaseConfig" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage and sign sidecars and OpenBB runtime
        shell: pwsh
        env:
          GURUTERMINAL_REQUIRE_DISTRIBUTION_SIGNING: "1"
          GURUTERMINAL_WINDOWS_TIMESTAMP_URL: https://timestamp.digicert.com
        run: apps/guruterminal/scripts/stage-windows-x64.ps1

      - name: Build and sign Guru Terminal
        working-directory: apps/guruterminal
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.GURUTERMINAL_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_CONFIG) {
            throw "TAURI_CONFIG must remain unset during release builds."
          }
          if (-not (Test-Path -LiteralPath $env:GURUTERMINAL_TAURI_RELEASE_CONFIG -PathType Leaf)) {
            throw "Merged Tauri release config is missing."
          }
          & npm exec -- tauri build `
            --target x86_64-pc-windows-msvc `
            --bundles nsis `
            --config $env:GURUTERMINAL_TAURI_RELEASE_CONFIG
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri Windows release build failed."
          }

      - name: Verify Authenticode and updater artifacts
        shell: pwsh
        timeout-minutes: 20
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $bundleRoot = "apps/guruterminal/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = @(Get-ChildItem -Path $bundleRoot -Filter "*-setup.exe" -File)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer/updater."
          }
          if (-not (Test-Path -LiteralPath ($installer.FullName + ".sig"))) {
            throw "Windows updater signature is missing."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "NSIS installer Authenticode verification failed: $($signature.StatusMessage)"
          }
          & apps/guruterminal/scripts/check-windows-installer.ps1 `
            -Installer $installer[0].FullName `
            -ExpectedVersion $env:RELEASE_VERSION `
            -RequireDistributionSigning
          if ($LASTEXITCODE -ne 0) {
            throw "Signed final NSIS package inspection failed."
          }

      - name: Normalize Windows release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python apps/guruterminal/scripts/prepare-release-assets.py `
            --platform windows `
            --version $env:RELEASE_VERSION `
            --bundle-root apps/guruterminal/src-tauri/target/x86_64-pc-windows-msvc/release/bundle `
            --output release-assets

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guruterminal-${{ needs.validate.outputs.version }}-windows-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:GURUTERMINAL_WINDOWS_CERTIFICATE_THUMBPRINT) {
            Remove-Item `
              -LiteralPath "Cert:\CurrentUser\My\$env:GURUTERMINAL_WINDOWS_CERTIFICATE_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP "guruterminal-signing.pfx"),
            (Join-Path $env:RUNNER_TEMP "guruterminal-tauri-release.json")
          )) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }

  publish:
    name: Assemble signed release candidate
    needs:
      - validate
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download signed platform assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: guruterminal-${{ needs.validate.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate static updater manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 apps/guruterminal/scripts/generate-update-manifest.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --pub-date "$PUBLISHED_AT" \
            --assets release-assets \
            --output release-assets/latest.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.50.0
          path: .
          format: spdx-json
          output-file: release-assets/Guru Terminal-${{ needs.validate.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize aliases, metadata, and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GURUTERMINAL_MACOS_BUNDLE_VERSION: ${{ needs.validate.outputs.macos_bundle_version }}
        run: |
          set -euo pipefail
          python3 apps/guruterminal/scripts/finalize-release-assets.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.validate.outputs.source_commit }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --macos-bundle-version "$GURUTERMINAL_MACOS_BUNDLE_VERSION" \
            --assets release-assets

      - name: Validate assembled release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          python3 apps/guruterminal/scripts/verify-release-assets.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.validate.outputs.source_commit }}" \
            --assets release-assets

      - name: Cryptographically verify updater packages against the configured public key
        shell: bash
        env:
          GURUTERMINAL_UPDATER_PUBLIC_KEY: ${{ secrets.GURUTERMINAL_UPDATER_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node apps/guruterminal/scripts/verify-updater-signatures.mjs \
            --version "$RELEASE_VERSION" \
            --assets release-assets

      - name: Attest assembled candidate provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*

      - name: Publish RC or stage stable draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets will not be replaced." >&2
            exit 1
          fi
          args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "Guru Terminal $RELEASE_VERSION"
            --notes "Signed Guru Terminal $RELEASE_VERSION installers and updater artifacts. Verify downloads with SHA256SUMS and RELEASE-METADATA.json."
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--draft)
          fi
          gh release create "${args[@]}" release-assets/*
          if [[ "$PRERELEASE" == true ]]; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')" = $'false\ttrue'
            apps/guruterminal/scripts/verify-published-release.sh "$GITHUB_REF_NAME"
          else
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          fi

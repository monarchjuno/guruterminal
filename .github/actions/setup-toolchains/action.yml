name: Setup Guru Terminal CI toolchains
description: Install pinned Node, Rust, Python, and uv, with optional Rust cache
inputs:
  node:
    default: "false"
  node-cache:
    default: apps/guruterminal/package-lock.json
  rust:
    default: "false"
  rust-components:
    default: ""
  rust-targets:
    default: ""
  rust-cache-key:
    default: ""
  python:
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Node 22.19
      if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22.19.0
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache }}

    - name: Install Rust
      if: ${{ inputs.rust == 'true' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.97.1
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust workspaces
      if: ${{ inputs.rust == 'true' && inputs.rust-cache-key != '' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          . -> target
          apps/guruterminal/src-tauri -> apps/guruterminal/src-tauri/target
        cache-on-failure: true

    - name: Install Python 3.12
      if: ${{ inputs.python == 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Install uv
      if: ${{ inputs.python == 'true' }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.11.2
        enable-cache: true
        cache-dependency-glob: |
          apps/guruterminal/python/uv.lock
          apps/guruterminal/openbb/uv.lock
